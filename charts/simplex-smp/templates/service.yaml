apiVersion: v1
kind: Service
metadata:
  name: {{ include "simplex-smp.fullname" . }}
  labels:
    {{- include "simplex-smp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if ne .Values.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector:
    {{- include "simplex-smp.selectorLabels" . | nindent 4 }}
  ports:
    - name: smp
      port: {{ .Values.service.port }}
      targetPort: smp
      protocol: TCP

