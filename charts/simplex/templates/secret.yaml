{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simplex.secretName" . }}
  labels:
    {{- include "simplex.labels" . | nindent 4 }}
type: Opaque
stringData:
  smp-password: {{ .Values.credentials.smpPassword | quote }}
  xftp-password: {{ .Values.credentials.xftpPassword | quote }}
  turn-username: {{ required "credentials.turnUsername must be set" .Values.credentials.turnUsername | quote }}
  turn-password: {{ required "credentials.turnPassword must be changed from an empty value" .Values.credentials.turnPassword | quote }}
{{- end }}
