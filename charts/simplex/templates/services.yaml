apiVersion: v1
kind: Service
metadata:
  name: {{ include "simplex.fullname" . }}-simplex-smp
  labels:
    {{- include "simplex.labels" . | nindent 4 }}
    app.kubernetes.io/component: smp
spec:
  type: LoadBalancer
  externalTrafficPolicy: {{ .Values.smp.service.externalTrafficPolicy }}
  {{- with .Values.publicIP }}
  externalIPs:
    - {{ . | quote }}
  {{- end }}
  selector:
    {{- include "simplex.selectorLabels" . | nindent 4 }}
  ports:
    - name: smp
      port: {{ .Values.smp.service.port }}
      targetPort: smp
      protocol: TCP
---
