apiVersion: v1
kind: Service
metadata:
  name: {{ include "simplex.fullname" . }}-turn
  labels:
    {{- include "simplex.labels" . | nindent 4 }}
    app.kubernetes.io/component: turn
spec:
  type: LoadBalancer
  externalTrafficPolicy: {{ .Values.turn.service.externalTrafficPolicy }}
  {{- with .Values.publicIP }}
  externalIPs:
    - {{ . | quote }}
  {{- end }}
  selector:
    {{- include "simplex.selectorLabels" . | nindent 4 }}
  ports:
    - name: turn-tcp
      port: {{ .Values.turn.listeningPort }}
      targetPort: turn-tcp
      protocol: TCP
    - name: turn-udp
      port: {{ .Values.turn.listeningPort }}
      targetPort: turn-udp
      protocol: UDP
    {{- range $port := untilStep (int .Values.turn.relay.minPort) (add1 (int .Values.turn.relay.maxPort) | int) 1 }}
    - name: relay-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
    {{- end }}
